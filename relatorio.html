<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json?v=20260826c" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg?v=20260826c" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260826c" />
  <meta name="theme-color" content="#0B0B10" />
  <title>Atendimentos — Swipo Agenda</title>
  <link rel="stylesheet" href="css/tokens.css?v=20260826c" />
  <link rel="stylesheet" href="css/base.css?v=20260826c" />
  <link rel="stylesheet" href="css/layout.css?v=20260826c" />
  <link rel="stylesheet" href="css/components.css?v=20260826c" />
</head>
<body data-page="relatorio">
  <div class="app">
    <main class="page">
      <header class="app-header" style="padding:0;margin-bottom:var(--space-5);">
        <button class="icon-btn" onclick="voltarParaAgenda()" aria-label="Ir para a Agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9"/><path d="M9 21v-6h6v6"/></svg>
        </button>
        <h1 class="app-header__title">Atendimentos</h1>
        <div class="app-header__acoes">
          <button class="icon-btn" aria-label="Ajuda" onclick="reiniciarTour('relatorios')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><text x="12" y="12.7" text-anchor="middle" dominant-baseline="middle" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-size="12.5" font-weight="700">?</text></svg>
          </button>
          <button class="icon-btn" aria-label="Calendário" data-abrir-modal="modal-calendario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
          </button>
        </div>
      </header>

      <div class="segmented section" id="js-periodo-tabs" style="margin-bottom:var(--space-3);">
        <span class="segmented__item is-active">Dia</span>
        <span class="segmented__item">Semana</span>
        <span class="segmented__item">Mês</span>
        <span class="segmented__item">Ano</span>
      </div>

      <div class="segmented section" style="padding:4px 8px;margin-bottom:var(--space-3);">
        <button class="icon-btn" id="js-periodo-anterior" aria-label="Período anterior">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="js-periodo-label" style="flex:1;text-align:center;">
          <span id="js-periodo-principal" style="display:block;font-weight:700;font-size:var(--text-xs);"></span>
          <span id="js-periodo-secundario" style="display:block;font-size:calc(var(--text-2xs) + 3px);color:var(--text-secondary);margin-top:1px;"></span>
        </span>
        <button class="icon-btn" id="js-periodo-proximo" aria-label="Próximo período">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div id="js-conteudo-atendimentos">
        <div class="card card--destaque section">
          <p class="text-secondary">Faturamento em atendimentos</p>
          <div class="row row--between" style="align-items:baseline;margin-bottom:8px;">
            <p style="font-weight:800;font-size:var(--text-xl);" id="js-relatorio-faturamento"></p>
            <p id="js-relatorio-faturamento-comparacao"></p>
          </div>
          <svg id="js-relatorio-grafico-svg" viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:140px;">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <line x1="42" y1="10" x2="288" y2="10" stroke="var(--border)" stroke-width="1"/>
            <line x1="42" y1="68" x2="288" y2="68" stroke="var(--border)" stroke-width="1"/>
            <line x1="42" y1="126" x2="288" y2="126" stroke="var(--border)" stroke-width="1"/>
            <text x="4" y="13" text-anchor="start" font-size="8.5" fill="var(--text-muted)" id="js-relatorio-eixo-max"></text>
            <text x="4" y="71" text-anchor="start" font-size="8.5" fill="var(--text-muted)" id="js-relatorio-eixo-meio"></text>
            <text x="4" y="129" text-anchor="start" font-size="8.5" fill="var(--text-muted)">R$0</text>
            <polygon id="js-relatorio-grafico-area" points="" fill="url(#areaGrad)"/>
            <polyline id="js-relatorio-grafico-linha" points="" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <g id="js-relatorio-grafico-dias" font-size="9" fill="var(--text-muted)" text-anchor="middle"></g>
          </svg>
        </div>

        <section class="section">
          <h2 class="section__title">Insights</h2>
          <div class="grid-3">
            <div class="insight-card">
              <div class="insight-card__label">
                <span>Atendimentos</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
              </div>
              <p class="insight-card__valor" id="js-relatorio-atendimentos"></p>
              <p class="insight-card__comparacao" id="js-relatorio-atendimentos-comparacao"></p>
            </div>
            <div class="insight-card">
              <div class="insight-card__label">
                <span>Ticket médio</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.5 1.5-2 3-2s3 .8 3 2-1.5 2-3 2-3 .5-3 2 1.5 2 3 2 3-.5 3-2"/></svg>
              </div>
              <p class="insight-card__valor" id="js-relatorio-ticket"></p>
            </div>
            <div class="insight-card">
              <div class="insight-card__label">
                <span>Taxas cartão</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
              </div>
              <p class="insight-card__valor" id="js-relatorio-taxas"></p>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section__title">Recebimentos</h2>
          <div class="card">
            <div class="row" style="align-items:center;gap:24px;">
              <div class="stack" style="flex:1;gap:10px;" id="js-relatorio-formas"></div>
              <svg width="100" height="100" viewBox="0 0 120 120" style="flex-shrink:0;">
                <g transform="rotate(-90 60 60)" id="js-relatorio-pizza"></g>
              </svg>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="row row--between" style="margin-bottom:8px;">
            <h2 class="section__title" style="margin-bottom:0;">Serviços mais realizados</h2>
            <button class="text-primary-accent link-ver-todos is-hidden" id="js-relatorio-mais-realizados-ver-todos">Ver todos</button>
          </div>
          <div class="card">
            <div id="js-relatorio-mais-realizados"></div>
            <div id="js-relatorio-mais-realizados-resto" class="is-hidden"></div>
            <div class="empty-state is-hidden" id="js-relatorio-mais-realizados-vazio"><p class="empty-state__title">Nenhum atendimento no período</p></div>
          </div>
        </section>

        <section class="section">
          <div class="row row--between" style="margin-bottom:8px;">
            <h2 class="section__title" style="margin-bottom:0;" id="js-atendimentos-realizados-titulo">Atendimentos</h2>
            <button class="text-primary-accent link-ver-todos is-hidden" id="js-atendimentos-realizados-toggle">Ver todas</button>
          </div>
          <div class="card" id="js-lista-atendimentos-realizados"></div>
          <div class="empty-state is-hidden" id="js-atendimentos-realizados-vazio"><p class="empty-state__title">Nenhum atendimento no período</p></div>
        </section>
      </div>
    </main>

    <div id="js-bottom-nav-mount"></div>

    <div class="modal-overlay is-hidden modal-overlay--centro" id="modal-calendario">
      <div class="modal-sheet modal-sheet--centro">
        <div class="row row--between" style="margin-bottom:16px;">
          <button class="icon-btn" id="js-cal-anterior" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <p style="font-weight:700;" id="js-cal-mes-label">Julho 2026</p>
          <button class="icon-btn" id="js-cal-proximo" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="cal-grid" style="margin-bottom:4px;">
          <span class="cal-grid__weekday">D</span><span class="cal-grid__weekday">S</span><span class="cal-grid__weekday">T</span><span class="cal-grid__weekday">Q</span><span class="cal-grid__weekday">Q</span><span class="cal-grid__weekday">S</span><span class="cal-grid__weekday">S</span>
        </div>
        <div class="cal-grid" id="js-cal-dias"></div>
      </div>
    </div>
  </div>

  <script src="js/utils.js?v=20260826c"></script>
  <script src="js/menu.js?v=20260826c"></script>
  <script src="js/storage.js?v=20260826c"></script>
  <script src="js/notificacoes-clientes.js?v=20260826c"></script>
  <script src="js/tema.js?v=20260826c"></script>
  <script src="js/app.js?v=20260826c"></script>
  <script src="js/chips.js?v=20260826c"></script>
  <script src="js/modal.js?v=20260826c"></script>
  <script src="js/ajuda-dados.js?v=20260826c"></script>
  <script src="js/ajuda.js?v=20260826c"></script>
  <script src="js/calendario.js?v=20260826c"></script>
  <script src="js/relatorio.js?v=20260826c"></script>
</body>
</html>
